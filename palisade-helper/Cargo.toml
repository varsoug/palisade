[workspace]

[package]
name = "palisade-helper"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "palisade-helper"
path = "src/main.rs"

[[bin]]
name = "palisade-helper-client"
path = "src/client.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
nix = { version = "0.29", features = ["socket", "uio", "process", "signal", "fs"] }
