[workspace]
resolver = "2"
members = ["gpconnect-core", "gpconnect-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://example.com/gpconnect"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "sync", "time", "process", "io-util", "rt-multi-thread"] }
thiserror = "2"

[profile.release]
opt-level = 2
lto = true
strip = true
