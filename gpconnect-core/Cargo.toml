[package]
name = "gpconnect-core"
description = "Core session management for the GPConnect GlobalProtect GUI client (wraps openconnect)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["fs"] }
thiserror.workspace = true
directories = "6"
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
tracing = "0.1"
nix = { version = "0.29", features = ["term"] }
