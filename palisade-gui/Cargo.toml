[package]
name = "palisade-gui"
description = "Open-source GUI client for Palo Alto GlobalProtect VPN (wraps openconnect)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "palisade"
path = "src/main.rs"

[dependencies]
palisade-core = { path = "../palisade-core" }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ksni = { version = "0.3", features = ["blocking"] }
fs2 = "0.4.3"
directories = "5"
png = "0.18.1"
slint = { version = "1.9.2", features = ["std", "compat-1-2", "backend-winit", "renderer-skia"], default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.9.2"
