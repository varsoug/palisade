name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # libdbus-sys (keyring crate) needs the system dbus headers.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  nix:
    name: nix build / dev shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build package
        run: nix build --print-build-logs .#palisade
      - name: Verify dev shell
        run: nix develop --command cargo --version

  # The module type-check evaluates a whole minimal NixOS system; keep it on
  # main pushes only so PRs stay fast.
  nix-module:
    name: NixOS module type-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check NixOS module
        run: nix build --print-build-logs .#checks.x86_64-linux.module-eval
