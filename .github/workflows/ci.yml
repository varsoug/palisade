name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # libdbus-sys (keyring crate) needs the system dbus headers.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  nix:
    name: nix build / module check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build package
        run: nix build --print-build-logs .#gpconnect
      - name: Check NixOS module (type-check)
        run: nix build --print-build-logs .#checks.x86_64-linux.module-eval
      - name: Verify dev shell
        run: nix develop --command cargo --version
